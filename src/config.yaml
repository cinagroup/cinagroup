site:
  name: CinaGroup
  site: 'https://cinagroup.com'
  base: '/'
  trailingSlash: true

  googleSiteVerificationId: null

# Default SEO metadata
metadata:
  title:
    default: CinaGroup — Search, automation, APIs, and infrastructure
    template: '%s — CinaGroup'
  description: 'CinaGroup builds practical tools for search, workflow automation, model access, reusable skills, and connected infrastructure.'
  keywords:
    - 'AI search'
    - 'workflow automation'
    - 'developer infrastructure'
    - 'CinaSeek'
    - 'CinaClaw'
    - 'CinaSkill'
    - 'CinaToken'
    - 'CinaChain'
    - 'AI API gateway'
    - 'automation'
    - 'enterprise AI'
    - 'AI assistant'
    - 'multi-model API'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: CinaGroup
    images:
      - url: '~/assets/images/cinagroup-system-hero-v1.png'
        width: 1200
        height: 675
        alt: 'CinaGroup product system — search, automation, APIs, and infrastructure'
    type: website
    locale: en_US
  twitter:
    handle: '@cinagroup'
    site: '@cinagroup'
    cardType: summary_large_image
  additional:
    - name: 'author'
      content: 'CinaGroup'
    - name: 'publisher'
      content: 'CinaGroup'
    - name: 'theme-color'
      content: '#171717'
    - name: 'application-name'
      content: 'CinaGroup'

# Favicon configuration
favicon:
  path: '/logo.png'
  apple: '/logo.png'
  safari: '/logo.png'

i18n:
  language: en
  textDirection: ltr
  locales:
    - en
    - zh

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/blog/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      # External scripts are intentionally disabled in astro.config.ts. Keep this null
      # until analytics is enabled together with consent and privacy controls.
      id: null
    splitbee:
      enabled: false # Set to true and add token for Splitbee analytics
      token: null

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
