# Cloudflare Wrangler 配置
# 用于本地开发和高级配置

# The Cloudflare Pages project name hosting cinagroup.com (dashboard: Account Home -> Workers & Pages).
# NOTE: this is `homepage`, NOT `cinagroup-homepage` (that project no longer exists).
name = "homepage"
compatibility_date = "2024-01-01"
pages_build_output_dir = "./dist"

# 环境变量
[vars]
SITE_NAME = "CinaGroup"
SITE_URL = "https://cinagroup.com"

# 开发服务器配置
[dev]
port = 3000
local_protocol = "http"
