name: CF Pages Git Integration Check
on:
  push:
    branches: [main]
    paths:
      - 'check-cf-pages/trigger'
      - '.github/workflows/cf-pages-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query Cloudflare Pages project
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p check-cf-pages
          curl -s -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/homepage" \
            -o check-cf-pages/result.json
          echo "curl exit code: $?"

      - name: Commit result back
        run: |
          git config user.name "cf-check-bot"
          git config user.email "cf-check-bot@users.noreply.github.com"
          git add check-cf-pages/result.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: cf pages git integration check result"
            git push
          fi
