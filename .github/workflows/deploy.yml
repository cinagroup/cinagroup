name: Deploy EmDash production Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation
        required: true
        type: choice
        default: validate
        options: [validate, deploy, deploy-and-initialize, deploy-and-resume-initialization, cutover, rollback]

# Automated briefing publishes are the only change set allowed to deploy on a
# plain push to main. They are confined to the briefing collection and its
# derived archive manifest; every other push stays validate-only. The
# auto-publish flag is computed once in `production` and gates the same deploy
# steps a manual `deploy` dispatch would run, so the full audit chain and the
# tracked contact migration still execute before any upload.

concurrency:
  group: emdash-production-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    name: Validate production Worker and deploy only when authorized
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EMDASH_BUILD_TARGET: production
      PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAAEigqtYgQBcKUhpa'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19'
          cache: npm
      - name: Require reviewed branch for a live operation
        if: github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.operation != 'validate')
        run: |
          case "$GITHUB_REF" in refs/heads/main|refs/heads/codex/emdash-migration) ;; *) exit 1 ;; esac
      - name: Detect automated briefing push
        id: briefing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # Only a push whose entire diff is the briefing collection plus its
          # derived archive manifest is an automated publish. Anything else
          # (or an empty/merge-only range) stays validate-only.
          base='${{ github.event.before }}'
          head='${{ github.sha }}'
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "auto=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$head")"
          test -n "$changed" || { echo "auto=false" >> "$GITHUB_OUTPUT"; exit 0; }
          auto=true
          while IFS= read -r path; do
            case "$path" in
              src/data/post/ai-news-briefing-*.md) ;;
              docs/briefing-archive-manifest.json) ;;
              *) auto=false ;;
            esac
          done <<< "$changed"
          echo "auto=$auto" >> "$GITHUB_OUTPUT"
          echo "Changed files:"; echo "$changed"
          echo "Automated briefing publish: $auto"
      - name: Install locked dependencies
        run: npm ci
      - name: Check types, lint and formatting
        run: npm run check:astro && npm run check:cloudflare && npm run check:eslint && npm run check:prettier
      - name: Test contact and multilingual routes
        run: npm run test:contact && npm run test:blog-i18n
      - name: Test CMS, authentication and production isolation
        run: npm run test:emdash && node --experimental-strip-types --test tests/emdash-deployment-target.test.mjs tests/emdash-production.test.mjs
      - name: Audit source content and build production
        run: npm run validate:site-content && npm run audit:source && npm run build
      - name: Verify generated production deployment target
        run: node scripts/emdash-production.mjs verify-build
      - name: Check bundle and startup without upload
        run: npx wrangler deploy --dry-run --name cinagroup-emdash-production --outdir dist/offline-worker && npx wrangler check startup --outfile /tmp/emdash-production-startup.cpuprofile
      - name: Render compiled production public responses with ephemeral local bindings
        run: node scripts/render-production-audit.mjs && node --experimental-strip-types scripts/verify-legacy-article-shell.mjs
      - name: Audit built public content and evidence
        run: npm run audit:evidence && npm run audit:content && npm run audit:blog && npm run audit:build
      - name: Verify live production resources
        if: (github.event_name == 'workflow_dispatch' && inputs.operation != 'validate') || steps.briefing.outputs.auto == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMDASH_ACCESS_ADMIN_EMAIL: ${{ secrets.EMDASH_ACCESS_ADMIN_EMAIL }}
        run: node scripts/emdash-production.mjs audit
      - name: Apply tracked contact migrations with exact production target
        if: (github.event_name == 'workflow_dispatch' && (inputs.operation == 'deploy' || inputs.operation == 'deploy-and-initialize' || inputs.operation == 'deploy-and-resume-initialization')) || steps.briefing.outputs.auto == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/emdash-production.mjs contact-before
          npx wrangler d1 migrations apply cinagroup-contact-submissions --remote --config wrangler.production.jsonc
          node scripts/emdash-production.mjs contact-after
      - name: Initialize missing public site content and menus
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'deploy-and-initialize' || inputs.operation == 'deploy-and-resume-initialization')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.operation }}" = "deploy-and-resume-initialization" ]; then
            node --experimental-strip-types scripts/initialize-site-content.mjs resume
          else
            node --experimental-strip-types scripts/initialize-site-content.mjs apply
          fi
      - name: Retain encrypted backup and public initialization proof
        if: always() && (inputs.operation == 'deploy-and-initialize' || inputs.operation == 'deploy-and-resume-initialization')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-content-initialization-proof
          path: |
            site-content-initialization-report.json
            site-content-backup.enc.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Deploy validated production Worker
        id: deploy
        if: (github.event_name == 'workflow_dispatch' && (inputs.operation == 'deploy' || inputs.operation == 'deploy-and-initialize' || inputs.operation == 'deploy-and-resume-initialization')) || steps.briefing.outputs.auto == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name cinagroup-emdash-production
      - name: Verify staged production Worker before routing
        if: steps.deploy.outcome == 'success' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover')
        run: node scripts/verify-emdash-production.mjs --staging
      - name: Attach production routes and verify live domains
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cutover'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMDASH_ACCESS_ADMIN_EMAIL: ${{ secrets.EMDASH_ACCESS_ADMIN_EMAIL }}
        run: |
          node scripts/emdash-production.mjs cutover
          if ! node scripts/verify-emdash-production.mjs; then
            node scripts/emdash-production.mjs rollback
            exit 1
          fi
      - name: Restore retained Pages routing
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/emdash-production.mjs rollback
