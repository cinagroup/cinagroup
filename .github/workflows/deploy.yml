# Deploy to Cloudflare Pages via GitHub Actions
#
# History:
# - Old workflows (cloudflare-deploy.yml / deploy.yml / actions.yaml) were removed in
#   bd487cb (2026-05-26) after repeated "Input required and not supplied: accountId"
#   failures — the CLOUDFLARE_ACCOUNT_ID secret was never supplied to the deploy action.
# - 2026-08-30: Pages project renamed `homepage` -> `cinagroup` (matches the
#   renamed repo cinagroup/cinagroup). Deploy target updated accordingly.
#   pages.dev subdomain retained: homepage-cj7.pages.dev.
# Supported production path:
# - GitHub Actions is the only repository-supported production deployment chain.
# - Cloudflare Pages direct Git integration must remain disconnected in the dashboard;
#   enabling both paths creates duplicate deployments for the same commit.
# - Pull requests and manual dispatches run validation only. Only a push to main deploys:
#     checks/tests -> build -> audits -> verify secrets -> Cloudflare Pages project `cinagroup`.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   - CLOUDFLARE_API_TOKEN   (Cloudflare API token with "Cloudflare Pages: Edit" permission)
#   - CLOUDFLARE_ACCOUNT_ID  (Cloudflare account id, e.g. 7ea8e46d8210bad342fa7595f7935fea)

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Validate and Deploy to Cloudflare Pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Astro types
        run: npm run check:astro

      - name: Check ESLint
        run: npm run check:eslint

      - name: Check formatting
        run: npm run check:prettier

      - name: Test contact endpoint
        run: npm run test:contact

      - name: Check Cloudflare Pages Functions
        run: npm run check:cloudflare

      - name: Audit governed source content
        run: npm run audit:source

      - name: Build site
        run: npm run build

      - name: Audit public evidence
        run: npm run audit:evidence

      - name: Audit content governance
        run: npm run audit:content

      - name: Audit blog structured data
        run: npm run audit:blog

      - name: Audit built site
        run: npm run audit:build

      # Fails fast with a clear, API-visible error when the deploy secrets are missing,
      # instead of the cryptic "Input required and not supplied: accountId" from before.
      # (The `secrets` context is not allowed inside step-level `if:` expressions, so
      # secret presence is mapped into env vars and checked in the shell instead.)
      - name: Verify Cloudflare secrets are configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CF_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CF_ACCOUNT_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_TOKEN_SET" != "true" ] || [ "$CF_ACCOUNT_SET" != "true" ]; then
            echo "::error::Cloudflare deploy secrets missing. Add these under Settings -> Secrets and variables -> Actions, then re-run:"
            echo "  - CLOUDFLARE_API_TOKEN  configured: $CF_TOKEN_SET"
            echo "  - CLOUDFLARE_ACCOUNT_ID configured: $CF_ACCOUNT_SET"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cinagroup --branch=main

      - name: Deployment summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌐 Production URL: https://cinagroup.com"
          echo "📊 Pages URL: https://homepage-cj7.pages.dev"
